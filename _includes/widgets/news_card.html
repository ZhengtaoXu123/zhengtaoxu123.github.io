{% assign news_by_year = site.news | sort: "date" | reverse | slice: 0, include.limit | group_by_exp: "item", "item.date | date: '%Y'" -%}

<div class="news-card my-3 bg-white shadow-sm rounded-sm">
    <h6 class="p-3 mb-0 border-bottom border-gray"><i class="fas fa-rss"></i> News</h6>
    <div class="px-3 pb-1">
        {% for year in news_by_year %}
        <div class="media py-1 {% unless forloop.first -%}border-top border-gray{%- endunless %}">
            <div class="mr-3 text-muted my-1">{{ year.name }}</div>
            <div class="media-body">
                {% for item in year.items %}
                <div class="news-item my-1">
                    <div class="news-content">{{ item.title }}</div>
                    <time class="news-date text-muted" datetime="{{ item.date | date: '%Y-%m' }}" aria-label="{{ item.date | date: '%B %Y' }}">{{ item.date | date: "%b" }}</time>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
